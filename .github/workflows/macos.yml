name: Native Mac release
on:
  workflow_dispatch:
    inputs:
      url:
        description: HTTPS address of the authenticated encrypted build snapshot
        required: true
      sha256:
        description: SHA-256 of the encrypted snapshot
        required: true
      overlay_url:
        description: Optional encrypted source correction archive
        required: false
      overlay_sha256:
        description: SHA-256 of the encrypted correction archive
        required: false
      runner:
        description: Standard Mac runner
        type: choice
        options: [macos-15]
        default: macos-15
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/cache/restore@v5
        id: snapshot-cache
        with:
          path: ${{ runner.temp }}/snapshot.enc
          key: volume-encrypted-snapshot-${{ inputs.sha256 }}
      - name: Authenticate and open the snapshot
        env:
          SNAPSHOT_URL: ${{ inputs.url }}
          SNAPSHOT_SHA: ${{ inputs.sha256 }}
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT_URL" == https://* ]]
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{64}$ ]]
          if [ ! -f "$RUNNER_TEMP/snapshot.enc" ]; then curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$SNAPSHOT_URL" -o "$RUNNER_TEMP/snapshot.enc"; fi
          echo "$SNAPSHOT_SHA  $RUNNER_TEMP/snapshot.enc" | shasum -a 256 --check
          node crypto.mjs decrypt "$RUNNER_TEMP/snapshot.enc" "$RUNNER_TEMP/snapshot.tar.gz"
          mkdir "$RUNNER_TEMP/payload"
          tar -xzf "$RUNNER_TEMP/snapshot.tar.gz" -C "$RUNNER_TEMP/payload"
      - uses: actions/cache/save@v5
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/snapshot.enc
          key: volume-encrypted-snapshot-${{ inputs.sha256 }}
      - name: Apply authenticated source corrections
        if: inputs.overlay_url != ''
        env:
          OVERLAY_URL: ${{ inputs.overlay_url }}
          OVERLAY_SHA: ${{ inputs.overlay_sha256 }}
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: |
          set -euo pipefail
          [[ "$OVERLAY_URL" == https://* ]]
          [[ "$OVERLAY_SHA" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$OVERLAY_URL" -o "$RUNNER_TEMP/overlay.enc"
          echo "$OVERLAY_SHA  $RUNNER_TEMP/overlay.enc" | shasum -a 256 --check
          node crypto.mjs decrypt "$RUNNER_TEMP/overlay.enc" "$RUNNER_TEMP/overlay.tar.gz"
          tar -xzf "$RUNNER_TEMP/overlay.tar.gz" -C "$RUNNER_TEMP/payload"
      - name: Build native dependencies
        run: bash "$RUNNER_TEMP/payload/source/app/scripts/mac-release-ci.sh" native >> "$RUNNER_TEMP/build.log" 2>&1
      - name: Check the application
        run: bash "$RUNNER_TEMP/payload/source/app/scripts/mac-release-ci.sh" checks >> "$RUNNER_TEMP/build.log" 2>&1
      - name: Package and verify
        run: |
          set +e
          bash "$RUNNER_TEMP/payload/source/app/scripts/mac-release-ci.sh" package >> "$RUNNER_TEMP/build.log" 2>&1
          result=$?
          echo "$result" > "$RUNNER_TEMP/build-exit-code"
          if [ "$result" != 0 ]; then echo 'Native build failed. Its encrypted log is attached.'; exit "$result"; fi
          echo 'Native build, signing verification and shared-file parity passed.'
      - name: Encrypt build diagnostics
        if: always()
        env:
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: |
          test -f "$RUNNER_TEMP/build.log" || echo 'Build did not start' > "$RUNNER_TEMP/build.log"
          mkdir -p results
          node crypto.mjs encrypt "$RUNNER_TEMP/build.log" results/build-log.enc
          if [ "$(cat "$RUNNER_TEMP/build-exit-code" 2>/dev/null)" = 0 ]; then cp "$RUNNER_TEMP/payload/results/"* results/; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: volume-${{ inputs.runner }}-${{ github.run_number }}
          path: results/
          retention-days: 3
          if-no-files-found: error
